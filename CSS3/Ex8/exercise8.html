<!DOCTYPE html>
<html>

<head>
    <title>Box Model and Layout</title>

    <link rel="stylesheet" href="styles8.css">
</head>

<body>

    <h1>Community Events</h1>

    <div class="eventCard">
        <h2>Music Event</h2>
        <p>Music event will be conducted this Sunday.</p>
    </div>

    <div class="eventCard">
        <h2>Sports Event</h2>
        <p>Sports activities will be held next week.</p>
    </div>

    <form>
        <label>Name</label>
        <input type="text" class="input1">

        <br><br>

        <label>Email</label>
        <input type="email" class="input1">
    </form>

    <h3>Visibility Hidden Example</h3>
    <p class="hide1">
        This text uses visibility hidden.
    </p>

    <h3>Display None Example</h3>
    <p class="hide2">
        This text uses display none.
    </p>

</body>

</html>
