<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner</title>
    <style>
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 25px;
        }
        .highlight {
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="welcomeBanner">
        Welcome to Community Event Portal
    </div>
    <br>
    <p class="highlight">
        Registration for events is now open!
    </p>
    <br>
    <span style="color:red; font-size:20px; font-weight:bold;">
        Limited Time Offer Available!
    </span>
</body>
</html>
