<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Video</title>
    <script>
        function videoReady() {
            alert("Video is ready to play");
        }
        window.onbeforeunload = function () {
            return "Are you sure you want to leave?";
        };
    </script>
</head>
<body>
    <center>
    <h1>Community Event Promo Video</h1>

    <video width="500" controls oncanplay="videoReady()">
        <source src="eventvideo.mp4" type="video/mp4">
    </video>
    </center>
</body>
</html>
