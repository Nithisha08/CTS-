<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Gallery</title>
    <style>
        .eventImage {
            width: 200px;
            height: 150px;
            border: 3px solid black;
        }
        figure {
            display: inline-block;
            margin: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <center>
    <h1>Community Event Gallery</h1>
    <figure>
        <img src="music.jpg" class="eventImage" alt="Music Event" title="Music Event">
        <figcaption>Music Event</figcaption>
    </figure>
    <figure>
        <img src="sports.jpg" class="eventImage" alt="Sports Event" title="Sports Event">
        <figcaption>Sports Event</figcaption>
    </figure>
    <figure>
        <img src="festival.jpg" class="eventImage" alt="Festival Event" title="Festival Event">
        <figcaption>Festival Event</figcaption>
    </figure>
    </center>
</body>
</html>
